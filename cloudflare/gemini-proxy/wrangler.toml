name = "life-os-gemini-proxy"
main = "src/index.js"
compatibility_date = "2026-08-25"

# Not secret — just the one origin allowed to call this Worker. Update if the GitHub Pages
# origin ever changes (custom domain, repo rename, etc.) and redeploy with `wrangler deploy`.
[vars]
ALLOWED_ORIGIN = "https://tytan-max.github.io"

# GEMINI_API_KEY is NOT set here — it's a real secret, set once via:
#   npx wrangler secret put GEMINI_API_KEY
# which stores it encrypted on Cloudflare's side, never in this repo.
