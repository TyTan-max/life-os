name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Lets you re-run a deploy from the Actions tab without needing a new commit — useful
  # right after changing a secret or repo variable, since that alone doesn't trigger a push.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deploy should ever be running at a time; a second push while one is still
# building cancels the older run rather than letting two builds race to publish.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run build
        env:
          # Baked into the built JS at this step — Vite's VITE_ vars are compile-time, not
          # read at runtime — so it has to be present here, not just set somewhere the
          # deployed site could read it later. Pulled from repository secrets rather than
          # committed, so none of these ever sit in the repo's history in plain text.
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
          VITE_TMDB_API_KEY: ${{ secrets.VITE_TMDB_API_KEY }}
          VITE_UNSPLASH_ACCESS_KEY: ${{ secrets.VITE_UNSPLASH_ACCESS_KEY }}
          # Deliberately NOT forwarding VITE_GEMINI_API_KEY here — a VITE_-prefixed var gets baked
          # straight into the public JS bundle, and Gemini's key is billable, so anyone extracting
          # it from DevTools could run up usage on this app's account. The deployed build instead
          # points at the Cloudflare Worker below, which holds the real key server-side.
          #
          # Both proxy URLs are public info, not secrets — set once as repo *variables*
          # (Settings → Secrets and variables → Actions → Variables tab), not the Secrets tab.
          VITE_IGDB_PROXY_URL: ${{ vars.VITE_IGDB_PROXY_URL }}
          VITE_GEMINI_PROXY_URL: ${{ vars.VITE_GEMINI_PROXY_URL }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
