[package]
name = "life-os"
version = "0.1.0"
description = "Life OS desktop shell — local-first vault for the Second Brain tab"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
rusqlite = { version = "0.31", features = ["bundled"] }
notify = "6"
walkdir = "2"
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
chrono = "0.4"
regex = "1"
anyhow = "1"
